name: Deploy AQUI NET HUB to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqui-net-hub-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build and type-check
        run: npm run build && npm run typecheck:worker && node --check scripts/run-browser-task.mjs

      - name: Check deployment credential availability
        id: cloudflare_credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped deployment when credentials are absent
        if: ${{ steps.cloudflare_credentials.outputs.available != 'true' }}
        run: echo "::warning::Build passed, but Cloudflare deployment was skipped because repository secrets are not configured."

      - name: Deploy Worker and static assets
        if: ${{ steps.cloudflare_credentials.outputs.available == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test production Worker
        if: ${{ steps.cloudflare_credentials.outputs.available == 'true' }}
        env:
          WORKER_URL: https://aqui-net-hub.kobonaaquilas.workers.dev
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "$WORKER_URL/api/health" -o /tmp/aqui-health.json; then
              if jq -e '.ok == true and .supabase == true' /tmp/aqui-health.json >/dev/null; then
                cat /tmp/aqui-health.json
                curl -fsS "$WORKER_URL/api/public/campaigns" | jq -e '.campaigns | type == "array"'
                ads_status=$(curl -sS -o /dev/null -w '%{http_code}' "$WORKER_URL/api/ads/campaigns")
                admin_status=$(curl -sS -o /dev/null -w '%{http_code}' "$WORKER_URL/api/admin/users")
                test "$ads_status" = "401" || { echo "::error::Unauthenticated ads API did not reject access (HTTP $ads_status)."; exit 1; }
                test "$admin_status" = "401" || { echo "::error::Unauthenticated admin API did not reject access (HTTP $admin_status)."; exit 1; }
                curl -fsS "$WORKER_URL/" -D /tmp/aqui-headers -o /dev/null
                grep -qi '^x-content-type-options: nosniff' /tmp/aqui-headers || { echo "::error::Security response header missing."; exit 1; }
                exit 0
              fi
            fi
            sleep 5
          done
          cat /tmp/aqui-health.json || true
          echo "::error::Production health check failed."
          exit 1
