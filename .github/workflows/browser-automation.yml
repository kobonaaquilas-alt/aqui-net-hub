name: AQUI NET HUB - Browser automation
run-name: Browser task ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Browser job identifier
        required: true
        type: string
      target_url:
        description: Public HTTPS page to inspect
        required: true
        type: string
      steps_json:
        description: Read-only browser steps in JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install project dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Block private and reserved network destinations
        shell: bash
        run: |
          set -euo pipefail
          for range in 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4; do
            sudo iptables -I OUTPUT -d "$range" -j REJECT
          done
          for range in ::/128 ::1/128 ::ffff:0:0/96 64:ff9b:1::/48 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8; do
            sudo ip6tables -I OUTPUT -d "$range" -j REJECT
          done

      - name: Run read-only browser task
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET_URL: ${{ inputs.target_url }}
          STEPS_JSON: ${{ inputs.steps_json }}
        run: node scripts/run-browser-task.mjs

      - name: Save browser result
        uses: actions/upload-artifact@v4
        with:
          name: browser-result-${{ inputs.request_id }}
          path: |
            result.json
            browser.png
          if-no-files-found: ignore
          retention-days: 2
